services:
  api: &typescript_app
    build:
      context: apps/api
      dockerfile: ../typescript.Dockerfile
      target: dev
    volumes:
      - ./apps/api:/home/node/app
      - apiapp_node_modules:/home/node/app/node_modules
    ports:
      - 9999:9999
    depends_on:
      orderworker:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    pre_start:
      - command:
          - npm
          - ci

  webapp:
    <<: *typescript_app
    build:
      context: apps/web
      dockerfile: ../typescript.Dockerfile
      target: dev
    volumes:
      - ./apps/web:/home/node/app
      - webapp_node_modules:/home/node/app/node_modules
    ports:
      - 5173:5173
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/api/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    pre_start:
      - command:
          - npm
          - ci

  orderworker:
    build:
      context: workers/order
      dockerfile: ../go.Dockerfile
      target: builder
      args:
        PROJECT_NAME: order
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
      TEMPORAL_TLS: ${TEMPORAL_TLS:-false}
    volumes:
      - ./workers/order:/go/app
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/readyz"]
      interval: 10s
      timeout: 10s
      retries: 3

  temporal:
    image: temporalio/temporal
    ports:
      - 7233:7233
      - 8233:8233
    command: server start-dev --ip 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health"]
      interval: 10s
      timeout: 10s
      retries: 3

volumes:
  apiapp_node_modules:
  webapp_node_modules:
