services:
  api: &typescript_app
    build:
      context: apps/api
      dockerfile: ../typescript.Dockerfile
      target: dev
    environment:
      ALLOW_INSECURE_PROFILE_URLS: "true"
      DB_URI: mongodb://mongodb:27017/mongodb
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      PORT: "9999"
      REQUIRE_SIGNATURES: "true"
      SCHEMA_URL: http://localhost:9999 # Matches the URL we're hosting the API on
      TEMPORAL_ADDRESS: temporal:7233
      WEBHOOK_SIGNING_KEY: /keys/webhook-signing-key.pem
    volumes:
      - ./apps/api:/home/node/app
      - apiapp_node_modules:/home/node/app/node_modules
      - signing_key:/keys:ro
    ports:
      - 9999:9999
    depends_on:
      orderworker:
        condition: service_healthy
      mongodb:
        condition: service_started
      temporal:
        condition: service_healthy
      webhook-key-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    pre_start:
      - command:
          - npm
          - ci

  webapp:
    <<: *typescript_app
    build:
      context: apps/web
      dockerfile: ../typescript.Dockerfile
      target: dev
    environment:
      API_URL: http://api:9999 # Server-side only: the browser calls the dashboard, not the API
      PORT: "5173"
    volumes:
      - ./apps/web:/home/node/app
      - webapp_node_modules:/home/node/app/node_modules
    ports:
      - 5173:5173
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/api/health"]
      interval: 10s
      timeout: 10s
      retries: 3
    pre_start:
      - command:
          - npm
          - ci

  orderworker:
    build:
      context: workers/order
      dockerfile: ../go.Dockerfile
      target: builder
      args:
        PROJECT_NAME: order
    environment:
      COMMERCE_API_URL: http://api:9999/v1
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
      TEMPORAL_TLS: ${TEMPORAL_TLS:-false}
    volumes:
      - ./workers/order:/go/app
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/readyz"]
      interval: 10s
      timeout: 10s
      retries: 3

  webhook-key-init:
    image: alpine/openssl
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu

        if [ ! -f /keys/webhook-signing-key.pem ]; then
          openssl genpkey \
            -algorithm ED25519 \
            -out /keys/webhook-signing-key.pem

          chown 1000:1000 /keys/webhook-signing-key.pem
          chmod 600 /keys/webhook-signing-key.pem
        fi
    volumes:
      - signing_key:/keys

  mongodb:
    image: mongo:7
    ports:
      - 27017:27017
    volumes:
      - mongodb_data:/data/db

  temporal:
    image: temporalio/temporal
    ports:
      - 7233:7233
      - 8233:8233
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /data/temporal.db
    volumes:
      - temporal_data:/data
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health"]
      interval: 10s
      timeout: 10s
      retries: 3
    pre_start:
      - image: alpine
        user: "0:0"
        command:
          - chown
          - -R
          - 1000:1000
          - /data

volumes:
  apiapp_node_modules:
  webapp_node_modules:
  signing_key:
  mongodb_data:
  temporal_data:
